# "v1.2.3" gibi bir etiket itilince Windows kurulum dosyasını derler ve bu deponun Release'lerine yükler.
# Kurulu uygulamalar yeni sürümü buradan bulup kendini günceller (guncelleme.js).
# Sürüm numarası package.json'daki "version" ile aynı olmalı.
name: Yayınla

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run yayinla
        env:
          GH_TOKEN: ${{ github.token }}
