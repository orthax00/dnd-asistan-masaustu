# package.json'daki "version" değişip main'e gönderilince (ya da Actions'tan elle çalıştırılınca) Windows kurulum
# dosyasını derler ve bu deponun Release'lerine "v<sürüm>" olarak yükler. Kurulu uygulamalar yeni sürümü buradan
# bulup kendini günceller (guncelleme.js).
name: Yayınla

on:
  push:
    branches: [main]
    paths: ["package.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sürüm etiketi
        id: surum
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "etiket=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null; then
            echo "yeni=hayir" >> "$GITHUB_OUTPUT"; echo "$v zaten yayınlanmış, atlanıyor."
          else
            git tag "$v" && git push origin "$v" && echo "yeni=evet" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
        if: steps.surum.outputs.yeni == 'evet'
      - run: npm run yayinla
        if: steps.surum.outputs.yeni == 'evet'
        env:
          GH_TOKEN: ${{ github.token }}
