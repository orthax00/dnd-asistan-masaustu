<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' https: data:" />
    <title>DnD Asistanı · Çevrimdışı</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body { background: #1c1410; color: #f3e2bd; font-family: Georgia, "Times New Roman", serif; }
      a { color: #e2bd6e; }
      button { font: inherit; cursor: pointer; color: #fbe6b4; background: #3a2a1e; border: 1px solid #b8924a; border-radius: 6px; padding: 6px 14px; }
      button:hover { background: #4a3626; }
      button.ana { background: #8e2219; border-color: #e2bd6e; }
      button.secili { background: #b8924a; color: #1c1410; }
      .serit { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
        padding: 10px 18px; background: #2a1c14; border-bottom: 2px solid #b8924a; }
      .serit img { width: 32px; height: 32px; }
      .etiket { padding: 3px 10px; border-radius: 999px; background: #6b4a12; color: #fbe6b4; font-size: 13px; letter-spacing: 0.03em; }
      .serit .bosluk { flex: 1; }
      .soluk { color: #b9a582; font-size: 14px; }
      main { max-width: 1150px; margin: 0 auto; padding: 18px; }
      h1, h2, h3 { color: #e2bd6e; font-weight: 700; letter-spacing: 0.02em; }
      h1 { font-size: 26px; margin: 6px 0 14px; }
      h2 { font-size: 20px; margin: 0 0 6px; }
      h3 { font-size: 15px; margin: 14px 0 4px; text-transform: uppercase; letter-spacing: 0.06em; color: #c9a45e; }
      .kart { background: #261a13; border: 1px solid #5a4330; border-radius: 10px; padding: 16px; }
      .kampanyalar { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
      .kampanyalar .kart { cursor: pointer; }
      .kampanyalar .kart:hover { border-color: #b8924a; }
      .sekmeler { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
      .duzen { display: grid; grid-template-columns: 290px 1fr; gap: 16px; align-items: start; }
      .liste { max-height: calc(100vh - 190px); overflow: auto; }
      .liste input { width: 100%; padding: 8px 10px; margin-bottom: 10px; font: inherit; color: #f3e2bd; background: #1c1410; border: 1px solid #5a4330; border-radius: 6px; }
      .grup { margin: 10px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #b9a582; }
      .oge { display: block; width: 100%; text-align: left; border: 0; border-radius: 6px; padding: 6px 8px; background: none; color: #f3e2bd; }
      .oge:hover, .oge.secili { background: #3a2a1e; color: #fbe6b4; }
      .baslik { display: flex; gap: 16px; align-items: flex-start; }
      .portre { width: 140px; height: 140px; object-fit: cover; border-radius: 8px; border: 2px solid #b8924a; flex: none; }
      .gorsel { float: right; width: 260px; max-width: 45%; margin: 0 0 10px 16px; border-radius: 8px; border: 2px solid #5a4330; }
      .genis { display: block; width: 100%; margin: 12px 0; border-radius: 8px; border: 2px solid #5a4330; }
      .metin { white-space: pre-wrap; line-height: 1.55; }
      section + section { margin-top: 10px; }
      ul { margin: 4px 0; padding-left: 20px; line-height: 1.5; }
      .degerler { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
      .deger { min-width: 92px; padding: 8px 12px; text-align: center; background: #1c1410; border: 1px solid #5a4330; border-radius: 8px; }
      .deger b { display: block; font-size: 20px; color: #fbe6b4; }
      .deger span { font-size: 12px; color: #b9a582; }
      .yetenekler { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
      .beceriler { columns: 3 200px; font-size: 14px; line-height: 1.7; }
      .yeterli { color: #e2bd6e; }
      .bos { padding: 40px; text-align: center; }
      @media (max-width: 800px) { .duzen { grid-template-columns: 1fr; } .yetenekler { grid-template-columns: repeat(3, 1fr); } }
    </style>
  </head>
  <body>
    <div class="serit">
      <img src="build/icon.png" alt="" />
      <b>DnD Asistanı</b>
      <span class="etiket">Çevrimdışı mod · salt okunur</span>
      <span class="soluk" id="esitleme"></span>
      <span class="bosluk"></span>
      <button id="kampanyalar" hidden>Kampanyalar</button>
      <button class="ana" id="baglan">Tekrar bağlan</button>
    </div>
    <main id="icerik"></main>
    <script src="cevrimdisi-goruntuleyici.js"></script>
  </body>
</html>
